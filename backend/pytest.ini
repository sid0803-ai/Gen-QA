[pytest]
asyncio_mode = auto
; Each async fixture uses its own pytest scope as its event-loop scope
; (the pytest-asyncio default when this ini option is left unset). This
; matters because tests/conftest.py deliberately never shares an asyncpg
; engine/connection across fixtures of different scopes (see conftest.py
; for why) -- so there is no scope mismatch to resolve here.
testpaths = tests
